version: 2

updates:
  # The PDF build workflow pins actions by major tag. Without this, they
  # silently drift majors behind (checkout sat on v4 while v7 was current).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "Bump"

  # build/build.py deps (markdown, weasyprint). These use floating >=
  # constraints, so expect mostly security updates rather than version bumps.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]
    commit-message:
      prefix: "Bump"
